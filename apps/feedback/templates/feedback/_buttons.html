<form method="post" action="{% url 'resource_feedback' resource.pk %}" class="feedback-form">
  {% csrf_token %}
  {% if fb.rating == "like" %}
    <button class="feedback-button is-active" name="action" value="clear_rating" aria-pressed="true" title="Undo like">Liked (undo)</button>
  {% else %}
    <button class="feedback-button" name="action" value="like" aria-pressed="false">Like</button>
  {% endif %}
  {% if fb.rating == "dislike" %}
    <button class="feedback-button is-active" name="action" value="clear_rating" aria-pressed="true" title="Undo dislike">Disliked (undo)</button>
  {% else %}
    <button class="feedback-button" name="action" value="dislike" aria-pressed="false">Dislike</button>
  {% endif %}
  {% if fb.progress == "done" %}
    <button class="feedback-button is-active" name="action" value="clear_progress" title="Undo done">Done (undo)</button>
  {% else %}
    <button class="feedback-button" name="action" value="done">Mark done</button>
  {% endif %}
  {% if fb.progress == "skipped" %}
    <button class="feedback-button is-active" name="action" value="clear_progress" title="Undo skip">Skipped (undo)</button>
  {% else %}
    <button class="feedback-button" name="action" value="skip">Skip</button>
  {% endif %}
</form>
